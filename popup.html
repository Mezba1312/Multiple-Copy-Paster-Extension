<!DOCTYPE html>
<html>
<head>
    <title>Row Copy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 140px; /* Narrower width */
            padding: 6px;
            margin: 0;
            background-color: #E1D4E4; /* Dusty lavender */
            color: #333; /* Dark text for contrast */
        }
        .row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .row textarea {
            width: 100%;
            height: 20px; /* Single line height */
            resize: none; /* Disable resize handle */
            padding: 4px;
            font-family: inherit;
            font-size: 0.85em;
            margin-bottom: 4px;
            border: 1px solid #999; /* Border color */
            border-radius: 4px;
            outline: none;
            background-color: white; /* Textarea background */
            color: black; /* Text color in textarea */
        }
        .row textarea:focus {
            border-color: #6c4f94; /* Focus color */
            box-shadow: 0 0 3px #6c4f94;
        }
        .button-group {
            display: flex;
            gap: 4px;
        }
        .button-group button {
            padding: 2px 6px;
            font-size: 0.75em;
            cursor: pointer;
            border: none;
            border-radius: 3px;
            background-color: #6c4f94; /* Button color */
            color: white; /* Button text color */
        }
    </style>
</head>
<body>
    <h3>Simple!</h3>
    <div id="rowsContainer"></div>

    <script src="popup.js"></script>
</body>
</html>
